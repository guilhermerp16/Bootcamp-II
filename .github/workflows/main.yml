name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Instalar dependências
        run: pip install -r "Analisador de texto/requirements.txt"

      - name: Rodar testes
        run: python -m pytest "Analisador de texto"

      - name: Rodar lint
        run: flake8 "Analisador de texto"
